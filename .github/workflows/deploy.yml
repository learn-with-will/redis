name: Deploy Redis Course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: learn-with-will/course-shell/.github/workflows/deploy-course.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
